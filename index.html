<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>NBA Standings — 2025-26 Final</title>
<style>
  :root {
    --bg: #0b0f1a;
    --panel: #131a2a;
    --panel-alt: #0f1524;
    --border: #232c42;
    --text: #e8ecf5;
    --text-dim: #8b93a7;
    --accent: #ff6b35;
    --win: #2fbf71;
    --loss: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem 1rem 4rem;
  }
  header {
    max-width: 1000px;
    margin: 0 auto 1.5rem;
    text-align: center;
  }
  header h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    margin: 0 0 0.25rem;
    letter-spacing: -0.02em;
  }
  header p.subtitle {
    color: var(--text-dim);
    margin: 0;
    font-size: 0.95rem;
  }
  .wrap {
    max-width: 1000px;
    margin: 0 auto;
  }
  .tabs {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    margin: 1.5rem 0 1rem;
  }
  .tab {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 0.5rem 1.25rem;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    transition: all 0.15s ease;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .conf-block { display: none; }
  .conf-block.active { display: block; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border-radius: 12px;
    overflow: hidden;
    font-size: 0.85rem;
  }
  thead th {
    background: var(--panel-alt);
    color: var(--text-dim);
    text-transform: uppercase;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    padding: 0.65rem 0.5rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  thead th:nth-child(2) { text-align: left; }
  tbody td {
    padding: 0.6rem 0.5rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  tbody td:nth-child(2) {
    text-align: left;
    font-weight: 600;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  tbody tr.playoff-cut td:first-child {
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .streak-w { color: var(--win); font-weight: 700; }
  .streak-l { color: var(--loss); font-weight: 700; }
  .diff-pos { color: var(--win); }
  .diff-neg { color: var(--loss); }
  footer {
    max-width: 1000px;
    margin: 2rem auto 0;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.78rem;
    line-height: 1.6;
  }
  footer a { color: var(--accent); }
  @media (max-width: 640px) {
    table { font-size: 0.72rem; }
    thead th, tbody td { padding: 0.45rem 0.3rem; }
    .home-road { display: none; }
  }
</style>
</head>
<body>

function streakClass(s) {
  if (!s) return "";
  return s.startsWith("W") ? "streak-w" : s.startsWith("L") ? "streak-l" : "";
}

function diffClass(d) {
  if (!d) return "";
  return d.trim().startsWith("-") ? "diff-neg" : "diff-pos";
}

function renderConference(conf) {
  const rows = DATA.filter(r => r.conference === conf)
                    .sort((a, b) => parseInt(a.seed) - parseInt(b.seed));

  const trs = rows.map(r => `
    <tr class="${parseInt(r.seed) <= 8 ? 'playoff-cut' : ''}">
      <td>${r.seed}</td>
      <td>${r.team}</td>
      <td>${r.wins}</td>
      <td>${r.losses}</td>
      <td>${r.win_pct}</td>
      <td>${r.games_behind}</td>
      <td class="home-road">${r.home}</td>
      <td class="home-road">${r.road}</td>
      <td class="${streakClass(r.streak)}">${r.streak}</td>
      <td class="${diffClass(r.differential)}">${r.differential}</td>
    </tr>
  `).join("");

  return `
    <div class="conf-block" data-conf="${conf}">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Team</th>
            <th>W</th>
            <th>L</th>
            <th>PCT</th>
            <th>GB</th>
            <th class="home-road">Home</th>
            <th class="home-road">Road</th>
            <th>Strk</th>
            <th>Diff</th>
          </tr>
        </thead>
        <tbody>${trs}</tbody>
      </table>
    </div>
  `;
}

const conferences = ["Eastern Conference", "Western Conference"];
document.getElementById("tables").innerHTML = conferences.map(renderConference).join("");
document.querySelector('.conf-block[data-conf="Eastern Conference"]').classList.add("active");

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".conf-block").forEach(b => b.classList.remove("active"));
    tab.classList.add("active");
    document.querySelector(`.conf-block[data-conf="${tab.dataset.conf}"]`).classList.add("active");
  });
});
</script>

</body>
</html>
